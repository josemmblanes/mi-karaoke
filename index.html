<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HSK Karaoke</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#f0f4f8;padding:20px 16px 32px;color:#1e293b}
.app{max-width:700px;margin:0 auto;background:#fff;border-radius:36px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:20px 20px 30px}
h1{font-size:1.8rem;text-align:center;margin-bottom:10px;color:#9a3412}
.sub{color:#5b6e8c;font-size:.8rem;margin-bottom:20px;border-left:3px solid #f97316;padding-left:12px}
.box{background:#f8fafc;border-radius:24px;padding:16px}
.r{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.r label.t{font-weight:600;width:80px;color:#334155}
.r label.c{cursor:pointer;font-size:.95rem}
select{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:12px;font-size:1rem;color:#1e293b}
button{border:0;border-radius:8px;padding:14px;font-weight:700;cursor:pointer;font-size:.9rem}
button:active{opacity:.8;transform:scale(.98)}
.go{background:#f97316;color:#fff}.tr{background:#fff7ed;color:#f97316;border:1px solid #ffedd5;font-weight:600}
.tr.active{background:#ffedd5;border-color:#f97316}
.ed{background:#a855f7;color:#fff}.sy{background:#ef4444;color:#fff}
.st{background:#f1f5f9;border-radius:8px;padding:12px;margin:20px 0;border-left:4px solid #1e293b;font-size:.9rem;color:#475569}
audio{width:100%;margin-bottom:15px}
#transcriptContainer{background:#fefce8;border-radius:24px;padding:20px 16px;min-height:200px;border:2px solid #fde68a}
.line{margin-bottom:8px;line-height:1.9}
.spk{font-weight:800;margin-right:6px;font-size:1.2rem}
.w{display:inline-block;border-radius:10px;padding:2px 3px;margin:0 1px;font-size:1.2rem;cursor:pointer}
.w.active{background:#fbbf24;font-weight:600}
.msg{text-align:center;color:#94a3b8;padding:20px}
.x{margin-top:24px;padding-top:18px;border-top:2px dashed #e2e8f0;display:flex;flex-direction:column;gap:10px;font-size:1.05rem;line-height:1.5;color:#334155}
.x.py{border-top-color:#a78bfa;color:#6b21a5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .b{background:#fff;border-radius:28px;max-width:550px;width:100%;padding:24px;max-height:95vh;overflow:auto}
.modal textarea{width:100%;padding:10px;border-radius:12px;border:1px solid #cbd5e1;font-family:monospace;margin-bottom:8px}
.lab{font-size:.8rem;color:#64748b;margin:6px 0 2px}
footer{font-size:.7rem;text-align:center;margin-top:20px;color:#94a3b8}
</style></head><body>
<div class="app">
<h1>🎧 HSK Karaoke</h1>
<div class="sub">✨ Aplicación para practicar el 听力.</div>
<div class="box">
 <div class="r"><label class="t">Nivel</label><select id="levelSelect" style="width:40%"></select>
  <label class="c"><input type="checkbox" id="chkLevel"> Todo el nivel</label></div>
 <div class="r"><label class="t">📖 Lección</label><select id="lessonSelect" style="width:40%"></select>
  <label class="c"><input type="checkbox" id="chkLesson"> Toda la lección</label></div>
 <div class="r" id="modeRow" style="display:none"><label class="t"></label>
  <button id="btnLoop" style="background:#10b981;color:#fff;opacity:.45;padding:8px 12px">🔄 Bucle</button>
  <button id="btnRnd" style="background:#2563eb;color:#fff;opacity:.45;padding:8px 12px">🔀 Aleatorio</button></div>
 <div class="r"><label class="t">🎙️ Audio</label><select id="audioSelect" style="flex:1"></select>
  <button id="btnLoad" class="go">▶️ Cargar</button></div>
 <div class="r"><button id="btnTr" class="tr" style="flex:1">📖 Mostrar traducción</button>
  <button id="btnPy" class="tr" style="flex:1">🔤 Mostrar pinyin</button></div>
 <div class="r" style="margin:0"><button id="btnEd" class="ed" style="flex:2">📝 Edición avanzada</button>
  <button id="btnSy" class="sy" style="flex:1">⚡ Sincronizar</button></div>
</div>
<div class="st" id="info">📌 Estado: cargando diálogos…</div>
<audio id="audioPlayer" controls></audio>
<div id="transcriptContainer"><div class="msg">🎤 Elige un audio y pulsa «Cargar».</div></div>
<footer>💾 Las ediciones se guardan solo en este navegador. Los textos originales están en dialogos.json.</footer>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), A=$('audioPlayer'), LS='hsk_edits_v3';
let ok=false;try{ok=btoa(prompt('Introduce la contraseña para acceder al Karaoke:')||'')==='YXVkaW9z'}catch(e){}
if(!ok){document.body.innerHTML='<h1>Acceso denegado</h1>';return}

let DB={},IDS=[],cur='',tokens=[],els=[],act=-1,raf=0,showTr=false,showPy=false,loop=false,rnd=false,ED={};
try{ED=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(ED))}catch(e){}};
const get=id=>Object.assign({zh:'',es:'',pinyin:''},DB[id],ED[id]);
const info=t=>$('info').textContent=t;
const cmp=(a,b)=>{const x=a.split('_').map(Number),y=b.split('_').map(Number);for(let i=0;i<3;i++)if((x[i]||0)!==(y[i]||0))return(x[i]||0)-(y[i]||0);return 0};
const opt=(v,t)=>`<option value="${v}">${t}</option>`;

function fillLevels(){$('levelSelect').innerHTML=[...new Set(IDS.map(i=>i.split('_')[0]))].map(n=>opt(n,'HSK '+n)).join('');fillLessons()}
function fillLessons(){const n=$('levelSelect').value;
 $('lessonSelect').innerHTML=[...new Set(IDS.filter(i=>i.startsWith(n+'_')).map(i=>i.split('_')[1]))].map(l=>opt(l,'Lección '+l)).join('');fillAudios()}
function fillAudios(){const p=$('levelSelect').value+'_'+$('lessonSelect').value+'_';
 $('audioSelect').innerHTML=IDS.filter(i=>i.startsWith(p)).map(i=>opt(i,'Diálogo '+i.split('_')[2]+' ('+i+'.mp3)'+(get(i).zh?'':' · sin texto'))).join('')}
function goTo(id,play){const[n,l]=id.split('_');$('levelSelect').value=n;fillLessons();$('lessonSelect').value=l;fillAudios();$('audioSelect').value=id;load(id,play)}

function parse(zh){
 return zh.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(l=>{
  const m=l.match(/^([A-Za-z男女\d]{1,3})\s*[:：]\s*(.*)$/),txt=m?m[2]:l;
  let w=txt.split(/\s+/).filter(Boolean);if(w.length===1&&w[0].length>4)w=Array.from(w[0]);
  return{spk:m?m[1]:'',w}})}
function render(){
 const d=get(cur),T=$('transcriptContainer');T.textContent='';tokens=[];els=[];act=-1;
 $('btnTr').style.display=d.es?'':'none';$('btnPy').style.display=d.pinyin?'':'none';
 if(!d.zh){const m=document.createElement('div');m.className='msg';
  m.append('📝 Este audio no tiene transcripción.',document.createElement('br'),'Pulsa «Edición avanzada» para añadirla.');T.append(m);return}
 parse(d.zh).forEach(L=>{const row=document.createElement('div');row.className='line';
  if(L.spk){const s=document.createElement('span');s.className='spk';s.textContent=L.spk+'：';row.append(s)}
  L.w.forEach(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;const i=tokens.length;
   s.onclick=()=>{if(isFinite(A.duration)){A.currentTime=tokens[i].s;tick()}};
   tokens.push({w:Math.max(1,w.length)});els.push(s);row.append(s,' ')});
  T.append(row)});
 const ex=document.createElement('div');ex.id='extra';T.append(ex);extras();retime(A.duration)}
function extras(){const ex=$('extra');if(!ex)return;const d=get(cur);ex.textContent='';
 [[showTr,d.es,'x'],[showPy,d.pinyin,'x py']].forEach(([on,t,c])=>{if(!on||!t)return;
  const b=document.createElement('div');b.className=c;t.split('\n').filter(s=>s.trim()).forEach(l=>{const p=document.createElement('div');p.textContent=l;b.append(p)});ex.append(b)})}
function retime(dur){dur=isFinite(dur)&&dur>0?dur:8;const st=.3,span=Math.max(1,dur-.8),W=tokens.reduce((a,t)=>a+t.w,0)||1;let c=0;
 tokens.forEach(t=>{t.s=st+span*c/W;c+=t.w;t.e=st+span*c/W})}
function tick(){const t=A.currentTime;let k=-1;
 for(let i=0;i<tokens.length;i++)if(t>=tokens[i].s&&t<tokens[i].e){k=i;break}
 if(k!==act){if(els[act])els[act].classList.remove('active');if(els[k])els[k].classList.add('active');act=k}
 if(!A.paused&&!A.ended)raf=requestAnimationFrame(tick)}

function load(id,play){
 if(!id||!DB[id])return;cur=id;cancelAnimationFrame(raf);A.pause();
 info('🎵 Cargado: '+id+'.mp3');A.src='audios/'+id+'.mp3';render();
 if(play)A.play().catch(()=>{})}
function multi(){return $('chkLevel').checked||$('chkLesson').checked}
function scope(){const[n,l]=cur.split('_');
 if($('chkLevel').checked)return IDS.filter(i=>i.startsWith(n+'_'));
 if($('chkLesson').checked)return IDS.filter(i=>i.startsWith(n+'_'+l+'_'));return[cur]}
function next(){if(!cur||!multi())return;const s=scope();let n;
 if(rnd&&s.length>1){do{n=s[Math.random()*s.length|0]}while(n===cur)}
 else{const k=s.indexOf(cur)+1;n=k<s.length?s[k]:loop?s[0]:null}
 if(n&&n!==cur)goTo(n,true);else if(n===cur){A.currentTime=0;A.play()}}
A.onended=next;
A.onerror=()=>{info('⚠️ No se encuentra audios/'+cur+'.mp3');if(multi()&&scope().length>1)setTimeout(next,800)};
A.onloadedmetadata=()=>retime(A.duration);
A.onplay=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)};
A.onseeked=tick;

function editor(){
 if(!cur)return alert('Carga un audio primero');
 const d=get(cur),mk=(t,v,r)=>{const e=document.createElement('textarea');e.rows=r;e.value=v;return e},
  lab=t=>{const e=document.createElement('div');e.className='lab';e.textContent=t;return e},
  z=mk(0,d.zh,6),p=mk(0,d.pinyin,3),e=mk(0,d.es,5),m=document.createElement('div'),b=document.createElement('div'),h=document.createElement('h3'),row=document.createElement('div');
 m.className='modal';b.className='b';h.textContent='✏️ '+cur;row.style.cssText='display:flex;gap:8px;margin-top:10px';
 const bt=(t,bg,f)=>{const x=document.createElement('button');x.textContent=t;x.style.cssText='flex:1;color:#fff;background:'+bg;x.onclick=f;return x},
  close=()=>m.remove();
 row.append(bt('💾 Guardar','#22c55e',()=>{ED[cur]={zh:z.value.trim(),pinyin:p.value.trim(),es:e.value.trim()};save();close();load(cur)}),
  bt('↺ Original','#f59e0b',()=>{delete ED[cur];save();close();load(cur)}),bt('Cancelar','#94a3b8',close));
 b.append(h,lab('Chino (una línea por intervención, palabras separadas por espacios)'),z,lab('Pinyin'),p,lab('Traducción'),e,row);m.append(b);document.body.append(m)}

$('levelSelect').onchange=fillLessons;$('lessonSelect').onchange=fillAudios;
$('btnLoad').onclick=()=>load($('audioSelect').value);
$('btnEd').onclick=editor;$('btnSy').onclick=()=>{retime(A.duration);tick()};
$('btnTr').onclick=()=>{showTr=!showTr;$('btnTr').classList.toggle('active',showTr);extras()};
$('btnPy').onclick=()=>{showPy=!showPy;$('btnPy').classList.toggle('active',showPy);extras()};
const mode=()=>$('modeRow').style.display=multi()?'':'none';
$('chkLevel').onchange=()=>{if($('chkLevel').checked)$('chkLesson').checked=false;mode()};
$('chkLesson').onchange=()=>{if($('chkLesson').checked)$('chkLevel').checked=false;mode()};
$('btnLoop').onclick=()=>{loop=!loop;$('btnLoop').style.opacity=loop?1:.45};
$('btnRnd').onclick=()=>{rnd=!rnd;$('btnRnd').style.opacity=rnd?1:.45};

(async()=>{
 try{const r=await fetch('dialogos.json',{cache:'no-store'});if(!r.ok)throw 0;DB=await r.json()}
 catch(e){info(location.protocol==='file:'?'❌ El navegador bloquea dialogos.json al abrir el HTML con doble clic. Sírvelo desde un servidor (por ejemplo GitHub Pages) junto a la carpeta audios.':'❌ No se pudo cargar dialogos.json (¿está junto a este HTML?).');return}
 try{const r=await fetch('audios/manifest.json',{cache:'no-store'});if(r.ok){const m=await r.json();
  if(Array.isArray(m))m.forEach(n=>{const id=n.replace(/\.[^.]+$/,'');if(!DB[id])DB[id]={zh:''}})}}catch(e){}
 IDS=Object.keys(DB).sort(cmp);fillLevels();info('✅ '+IDS.length+' diálogos cargados.')})();
})();
</script></body></html>
